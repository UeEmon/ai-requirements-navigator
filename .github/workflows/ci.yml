name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: arn
          POSTGRES_PASSWORD: arn
          POSTGRES_DB: arn_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U arn" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://arn:arn@localhost:5432/arn_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Japanese font for PDF tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Type check
        run: npm run typecheck
      - name: Test (unit + PostgreSQL)
        shell: bash
        run: |
          set +e
          NO_COLOR=1 FORCE_COLOR=0 npm test > /tmp/test.log 2>&1
          ec=$?
          cat /tmp/test.log
          # 注釈は1ステップ10件までなので、失敗に関係する行だけを出す
          if [ $ec -ne 0 ]; then grep -E "FAIL|×|Error|expected|❯ .*test\.ts|Unhandled|Timeout" /tmp/test.log | grep -v "^\s*$" | head -10 | while IFS= read -r l; do echo "::error::$l"; done; fi
          exit $ec
      - name: License check (production dependencies)
        run: npm run licenses
      - name: License check (including dev tools)
        run: node scripts/check-licenses.mjs --all

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t arn:ci .
      - name: Smoke test (Postgres + app)
        run: |
          docker network create arn
          docker run -d --name db --network arn -e POSTGRES_USER=arn -e POSTGRES_PASSWORD=arn -e POSTGRES_DB=arn postgres:16-alpine
          for i in $(seq 1 30); do docker exec db pg_isready -U arn && break; sleep 1; done
          docker run -d --name app --network arn -p 8787:8787 \
            -e NODE_ENV=development -e STORE=postgres -e DATABASE_URL=postgres://arn:arn@db:5432/arn \
            -e KEY_ENCRYPTION=local -e MASTER_KEY=$(openssl rand -base64 32) -e AUTH_MODE=dev -e ALLOW_MOCK_PROVIDER=true arn:ci
          for i in $(seq 1 30); do curl -fs localhost:8787/health && break; sleep 1; done
          ORG=$(curl -fs -X POST localhost:8787/api/orgs -H 'content-type: application/json' -d '{"name":"ci"}' | jq -r .id)
          H=(-H 'content-type: application/json' -H "x-org-id: $ORG" -H 'x-role: admin')
          P1=$(curl -fs -X POST localhost:8787/api/orgs/$ORG/providers "${H[@]}" -d '{"vendor":"mock","model":"mock","label":"m1"}' | jq -r .id)
          P2=$(curl -fs -X POST localhost:8787/api/orgs/$ORG/providers "${H[@]}" -d '{"vendor":"mock","model":"mock","label":"m2"}' | jq -r .id)
          P3=$(curl -fs -X POST localhost:8787/api/orgs/$ORG/providers "${H[@]}" -d '{"vendor":"mock","model":"mock","label":"judge"}' | jq -r .id)
          PJ=$(curl -fs -X POST localhost:8787/api/orgs/$ORG/projects "${H[@]}" -d "{\"name\":\"ci\",\"aiConfig\":{\"mode\":\"multi\",\"generatorIds\":[\"$P1\",\"$P2\"],\"evaluatorId\":\"$P3\"}}" | jq -r .id)
          R=$(curl -fs -X POST localhost:8787/api/projects/$PJ/rounds "${H[@]}" -d '{"answer":"電話予約を減らしたい"}' | jq -r .id)
          curl -fs -X POST localhost:8787/api/rounds/$R/decision "${H[@]}" -d '{"pick":"merged"}' | jq .nextPhase
          curl -fs localhost:8787/api/projects/$PJ/spec.md "${H[@]}" | head -20
          # 質問ガイド・非同期実行・UMLの比較と採用・要件の編集・監査ログ
          curl -fs -X POST localhost:8787/api/projects/$PJ/guide "${H[@]}" -d '{}' | jq -c '{source, coverage, missing}'
          JOB=$(curl -fs -X POST "localhost:8787/api/projects/$PJ/rounds?async=1" "${H[@]}" -d '{"answer":"顧客と店長が使う"}' | jq -r .jobId)
          for i in $(seq 1 30); do S=$(curl -fs localhost:8787/api/jobs/$JOB "${H[@]}" | jq -r .status); [ "$S" = done ] && break; [ "$S" = failed ] && exit 1; sleep 1; done
          [ "$S" = done ] && echo "::notice::非同期ジョブOK"
          UR=$(curl -fs -X POST localhost:8787/api/projects/$PJ/uml/generate "${H[@]}" | jq -r .umlRoundId)
          curl -fs -X POST localhost:8787/api/uml-rounds/$UR/adopt "${H[@]}" -d '{"label":"A"}' | jq -c '[.diagrams[].kind]'
          RQ=$(curl -fs localhost:8787/api/projects/$PJ/requirements "${H[@]}" | jq -r '.[0].id')
          curl -fs -X PATCH localhost:8787/api/requirements/$RQ "${H[@]}" -d '{"title":"編集した要件","reason":"CI"}' | jq -c '{code, version}'
          curl -fs "localhost:8787/api/orgs/$ORG/audit?limit=5" "${H[@]}" | jq -c '[.entries[].action]'
          # 実装工程への連携: 機能要件を確定 → タスク分解（非同期）→ CSV → トレーサビリティ → 連携先の登録（外部へは接続しない）
          R2=$(curl -fs -X POST localhost:8787/api/projects/$PJ/rounds "${H[@]}" -d '{"answer":"ネットで予約したい","phaseKey":"functions"}' | jq -r .id)
          curl -fs -X POST localhost:8787/api/rounds/$R2/decision "${H[@]}" -d '{"pick":"merged","advancePhase":false}' | jq -c '[.added[].code]'
          TJ=$(curl -fs -X POST "localhost:8787/api/projects/$PJ/tasks/generate?async=1" "${H[@]}" | jq -r .jobId)
          for i in $(seq 1 30); do S=$(curl -fs localhost:8787/api/jobs/$TJ "${H[@]}" | jq -r .status); [ "$S" = done ] && break; [ "$S" = failed ] && exit 1; sleep 1; done
          STORIES=$(curl -fs localhost:8787/api/projects/$PJ/tasks "${H[@]}" | jq -r .stats.stories)
          [ "$STORIES" -ge 1 ] && echo "::notice::タスク分解OK（ストーリー $STORIES 件）"
          curl -fs localhost:8787/api/projects/$PJ/tasks/file/jira.csv "${H[@]}" | head -2
          curl -fs localhost:8787/api/projects/$PJ/trace "${H[@]}" | jq -ce '.summary | select(.covered == .targets)'
          curl -fs -X POST localhost:8787/api/orgs/$ORG/integrations "${H[@]}" -d '{"kind":"github","config":{"owner":"acme","repo":"app"},"token":"ghp_dummy1234"}' | jq -ce 'select(.token == "••••1234") | {target, token}'
          # 資料の取り込み → 分析（非同期・複数AIの比較）→ 採用 → 要件が EARS の文になっているか
          DOC=$(curl -fs -X POST localhost:8787/api/projects/$PJ/documents "${H[@]}" -d '{"name":"議事録.txt","kind":"minutes","text":"受付担当が電話で予約を受け、紙の受付票に記入している。\n店長が毎晩、受付票をExcelに転記している。"}' | jq -r .id)
          AJ=$(curl -fs -X POST "localhost:8787/api/projects/$PJ/analyses?async=1" "${H[@]}" -d "{\"documentIds\":[\"$DOC\"]}" | jq -r .jobId)
          for i in $(seq 1 30); do S=$(curl -fs localhost:8787/api/jobs/$AJ "${H[@]}" | jq -r .status); [ "$S" = done ] && break; [ "$S" = failed ] && exit 1; sleep 1; done
          AN=$(curl -fs localhost:8787/api/jobs/$AJ "${H[@]}" | jq -r .result.id)
          curl -fs -X POST localhost:8787/api/analyses/$AN/adopt "${H[@]}" -d '{"label":"A","proposalIds":["P1"],"requirementIndexes":[0,1]}' | jq -c '.requirementCodes'
          BAD=$(curl -fs localhost:8787/api/projects/$PJ/requirements "${H[@]}" | jq '[.[] | select(.source | startswith("資料分析")) | select(.lint.ok | not)] | length')
          [ "$BAD" = 0 ] && echo "::notice::資料分析OK（採用した要件はすべて EARS の検査を通過）"
          # 非機能要件シート: システムの性格 → 複数AIの提案 → 一致した提案の採用 → EARS の非機能要件 → 確定前の確認
          curl -fs -X PUT localhost:8787/api/projects/$PJ/nfr/profile "${H[@]}" -d '{"users":2,"impact":1,"data":2,"hours":1,"scale":1,"purpose":1,"budget":0}' | jq -c '{grade: .grade.label, similar: [.sizing.similar[].name]}'
          NJ=$(curl -fs -X POST "localhost:8787/api/projects/$PJ/nfr/suggest?async=1" "${H[@]}" -d '{}' | jq -r .jobId)
          for i in $(seq 1 30); do S=$(curl -fs localhost:8787/api/jobs/$NJ "${H[@]}" | jq -r .status); [ "$S" = done ] && break; [ "$S" = failed ] && exit 1; sleep 1; done
          curl -fs -X POST localhost:8787/api/projects/$PJ/nfr/apply-suggestions "${H[@]}" -d '{}' | jq -c '{applied: (.applied | length), coverage: .sheet.evaluation.coverage}'
          NADD=$(curl -fs -X POST localhost:8787/api/projects/$PJ/nfr/requirements "${H[@]}" -d '{"systemName":"予約システム"}' | jq '.added | length')
          [ "$NADD" -gt 5 ] && echo "::notice::非機能要件シートOK（EARSの非機能要件 $NADD 件）"
          curl -fs localhost:8787/api/projects/$PJ/nfr "${H[@]}" | jq -c '.evaluation | {coverage, findings: [.findings[].severity]}'
          SIM=$(curl -fs -X POST localhost:8787/api/projects/$PJ/nfr/review "${H[@]}" -d '{}' | jq '.sizing.similar | length')
          [ "$SIM" -ge 1 ] && echo "::notice::非機能要件の適正化OK（似た事例 $SIM 件と比較）"
          # 画面イメージ → 要件定義の確定 → 変更要求の影響分析（非同期）→ 変更
          SC=$(curl -fs -X POST localhost:8787/api/projects/$PJ/screens/generate "${H[@]}" -d '{}' | jq -r .screens.revision)
          [ "$SC" = 1 ] && echo "::notice::画面イメージOK"
          curl -fs localhost:8787/api/projects/$PJ/screens/prototype.html "${H[@]}" | grep -q 'ワイヤーフレーム'
          curl -fs -X POST localhost:8787/api/projects/$PJ/screens/feedback "${H[@]}" -d '{"text":"ボタンの色を青にしてほしい"}' | jq -ce 'select(.feedback.level == "detail") | .guidance'
          curl -fs -X POST localhost:8787/api/projects/$PJ/baseline "${H[@]}" -d '{"reason":"CI（非機能要件は別途確認）","force":true}' | jq -c '{version}'
          RQ1=$(curl -fs localhost:8787/api/projects/$PJ/requirements "${H[@]}" | jq -r '[.[] | select(.type == "FR")][0].id')
          CR=$(curl -fs -X POST localhost:8787/api/projects/$PJ/changes "${H[@]}" -d "{\"kind\":\"modify\",\"requirementId\":\"$RQ1\",\"title\":\"変更後の要件\",\"reason\":\"CI\"}" | jq -r .id)
          IJ=$(curl -fs -X POST "localhost:8787/api/changes/$CR/analyze?async=1" "${H[@]}" | jq -r .jobId)
          for i in $(seq 1 30); do S=$(curl -fs localhost:8787/api/jobs/$IJ "${H[@]}" | jq -r .status); [ "$S" = done ] && break; [ "$S" = failed ] && exit 1; sleep 1; done
          curl -fs -X POST localhost:8787/api/changes/$CR/decide "${H[@]}" -d '{"option":"apply","reason":"CI"}' | jq -ce 'select(.change.decision.baselineVersion == 2) | {status: .change.status, stories: (.followUps.stories | length)}' && echo "::notice::変更管理OK（確定版 v2）"
          # コーディング・テスト工程への引き継ぎ: テストケース・着手前チェック・引き継ぎパッケージ
          TC=$(curl -fs localhost:8787/api/projects/$PJ/tests "${H[@]}" | jq -e 'select(.trace.coverage == 1) | .counts.total')
          curl -fs localhost:8787/api/projects/$PJ/tests.csv "${H[@]}" | head -c 40 | grep -q 'テストID'
          curl -fs localhost:8787/api/projects/$PJ/readiness "${H[@]}" | jq -c '{verdict, score, counts}'
          curl -fs localhost:8787/api/projects/$PJ/handoff.json "${H[@]}" | jq -e 'select(.format == "arn-handoff/1") | {requirements: (.requirements | length), tests: (.tests.cases | length)}'
          curl -fs localhost:8787/api/projects/$PJ/spec.md "${H[@]}" | grep -qE '## [0-9]+\. テスト仕様' && echo "::notice::引き継ぎOK（テストケース $TC 件）"
          # 要件定義で決めること: 業務ルール・用語集・受け入れ基準・レビュー・差分
          curl -fs localhost:8787/api/meta | jq -e '[.phases[].key] | index("rules")' > /dev/null
          curl -fs -X PUT localhost:8787/api/projects/$PJ/glossary "${H[@]}" -d '{"terms":[{"term":"予約","definition":"来店の約束","synonyms":["申込"],"codeName":"Reservation"}]}' | jq -ce '{terms: (.terms | length), variants: (.variants | length)}'
          curl -fs localhost:8787/api/projects/$PJ/acceptance "${H[@]}" | jq -ce '{defined, accepted: .evaluation.accepted, items: (.evaluation.items | length)}'
          curl -fs localhost:8787/api/projects/$PJ/reviews "${H[@]}" | jq -ce '{status}'
          curl -fs "localhost:8787/api/projects/$PJ/baselines/diff?from=1&to=2" "${H[@]}" | jq -ce '{added: (.added | length), modified: (.modified | length), tests: (.affected.tests | length)}'
          curl -fs localhost:8787/api/projects/$PJ/spec.md "${H[@]}" | grep -q 'この要件定義書の範囲' && echo "::notice::要件定義の範囲OK（業務ルール・用語集・受け入れ基準・レビュー・差分）"
          # 開発・テストのツールとの連携: トークン → MCP → JUnit XML の取り込み → 開発用パッケージ
          TOK=$(curl -fs -X POST localhost:8787/api/orgs/$ORG/api-tokens "${H[@]}" -d "{\"name\":\"CI\",\"scopes\":[\"report\"],\"projectIds\":[\"$PJ\"]}" | jq -r .token)
          A=(-H "authorization: Bearer $TOK" -H 'content-type: application/json' -H 'accept: application/json, text/event-stream')
          curl -fs localhost:8787/api/v1/openapi.json | jq -e '.openapi == "3.1.0"' > /dev/null
          curl -fs -X POST localhost:8787/mcp "${A[@]}" -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' | jq -ce '.result | {protocolVersion, server: .serverInfo.name}'
          NT=$(curl -fs -X POST localhost:8787/mcp "${A[@]}" -d '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' | jq '.result.tools | length')
          curl -fs -X POST localhost:8787/mcp "${A[@]}" -d '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"get_project_overview","arguments":{}}}' | jq -ce '.result | select(.isError == false) | .structuredContent.counts'
          curl -fs -X POST "localhost:8787/api/v1/projects/$PJ/test-runs?tool=ci&revision=$GITHUB_SHA" -H "authorization: Bearer $TOK" -H 'content-type: application/xml' \
            --data-binary '<testsuites><testsuite name="ci"><testcase name="TC-FR-01-1 ok"/><testcase name="other"/></testsuite></testsuites>' | jq -ce 'select(.summary.passed == 1) | .summary'
          curl -fs localhost:8787/api/v1/projects/$PJ/agent-pack.zip -H "authorization: Bearer $TOK" -o pack.zip && unzip -l pack.zip | grep -q 'AGENTS.md' && unzip -l pack.zip | grep -q '.mcp.json'
          echo "::notice::外部連携OK（MCPのツール $NT 個、開発用パッケージ $(unzip -l pack.zip | tail -1 | awk '{print $2}') ファイル）"
          curl -fs -X POST localhost:8787/api/projects/$PJ/exports "${H[@]}" -d '{"format":"docx"}' -o spec.docx && file spec.docx
          curl -fs -X POST localhost:8787/api/projects/$PJ/exports "${H[@]}" -d '{"format":"pdf"}' -o spec.pdf && head -c 5 spec.pdf | grep -q '%PDF-'
          grep -a -q 'NotoSansCJK' spec.pdf && echo "::notice::PDFに日本語フォント(Noto Sans CJK)が埋め込まれています ($(stat -c%s spec.pdf) bytes)"
          unzip -l spec.docx | grep -q 'word/document.xml' && echo "::notice::Word出力OK ($(stat -c%s spec.docx) bytes)"
          ls -la spec.docx spec.pdf
          curl -fs localhost:8787/ | grep -q '要件ナビ'
          curl -fs localhost:8787/vendor/mermaid.min.js > /dev/null
          curl -fs localhost:8787/THIRD_PARTY_NOTICES.txt | head -3
      - name: Logs on failure
        if: failure()
        shell: bash
        run: docker logs app 2>&1 | tail -40 | while IFS= read -r l; do echo "::error::$l"; done

  # Docker Desktop の手順（docs/docker-desktop.md）どおりに docker compose で起動して使えるか
  compose:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Start with docker compose (same steps as docs/docker-desktop.md)
        shell: bash
        run: |
          cp .env.example .env
          KEY=$(docker run --rm node:22-alpine node -e "console.log(require('crypto').randomBytes(32).toString('base64'))")
          sed -i "s|^MASTER_KEY=.*|MASTER_KEY=$KEY|" .env
          docker compose up -d --build
          for i in $(seq 1 60); do curl -fs localhost:8787/health && break; sleep 2; done
          # 既定ではこのPCからだけ接続できる
          docker compose port app 8787 | grep -q '^127.0.0.1:'
      - name: Use the app (organization → AI → sample → spec saved to the volume → MCP)
        shell: bash
        run: |
          set -euo pipefail
          ORG=$(curl -fs -X POST localhost:8787/api/orgs -H 'content-type: application/json' -d '{"name":"compose"}' | jq -r .id)
          H=(-H 'content-type: application/json' -H "x-org-id: $ORG" -H 'x-role: admin' -H 'x-user-id: admin')
          for l in m1 m2 judge; do curl -fs -X POST localhost:8787/api/orgs/$ORG/providers "${H[@]}" -d "{\"vendor\":\"mock\",\"model\":\"mock\",\"label\":\"$l\"}" > /dev/null; done
          PJ=$(curl -fs -X POST localhost:8787/api/orgs/$ORG/samples "${H[@]}" -d '{}' | jq -r .project.id)
          # 仕様書を保存先（Docker ボリューム）に残せる
          KEYPATH=$(curl -fsS -D - -o spec.docx -X POST localhost:8787/api/projects/$PJ/exports "${H[@]}" -d '{"format":"docx"}' | tr -d '\r' | awk -F': ' 'tolower($1)=="x-artifact-key"{print $2}')
          test -n "$KEYPATH"
          docker compose exec -T app ls -l "/data/artifacts/$KEYPATH"
          # 再起動してもデータが残る
          docker compose restart app
          for i in $(seq 1 60); do curl -fs localhost:8787/health && break; sleep 2; done
          curl -fs localhost:8787/api/projects/$PJ/requirements "${H[@]}" | jq -e 'length == 69' > /dev/null
          TOK=$(curl -fs -X POST localhost:8787/api/orgs/$ORG/api-tokens "${H[@]}" -d "{\"name\":\"local\",\"projectIds\":[\"$PJ\"]}" | jq -r .token)
          curl -fs -X POST localhost:8787/mcp -H "authorization: Bearer $TOK" -H 'content-type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"get_project_overview","arguments":{}}}' | jq -e '.result.isError == false' > /dev/null
          echo "::notice::docker compose の手順OK（保存先 /data/artifacts/$KEYPATH、再起動後も要件 69件）"
      - name: Logs on failure
        if: failure()
        run: docker compose logs app | tail -60
      - name: Clean up
        if: always()
        run: docker compose down -v

  cdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/aws
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Type check CDK app
        run: npx tsc -p tsconfig.json
      - name: Synthesize (no AWS credentials needed)
        shell: bash
        run: |
          set +e
          npx cdk synth --quiet > /tmp/synth.log 2>&1
          ec=$?
          if [ $ec -ne 0 ]; then tail -40 /tmp/synth.log | while IFS= read -r l; do echo "::error::$l"; done; fi
          exit $ec

  # main への push と v から始まるタグで、テストがすべて通ったイメージを GitHub Container Registry に公開する。
  # タグのときは Docker キット（compose.yml・.env.example）を付けてリリースを作る。手順: docs/github-deploy.md
  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [test, docker, compose, cdk]
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Names
        shell: bash
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "SHA_TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "KIT_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"; else echo "KIT_VERSION=main" >> "$GITHUB_ENV"; fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=ai-requirements-navigator
            org.opencontainers.image.description=AI-assisted requirements definition (Japanese UI)
            org.opencontainers.image.licenses=Apache-2.0
      - name: Build and push (amd64 / arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Docker kit
        shell: bash
        run: |
          rm -rf kit && mkdir -p kit/keycloak
          sed "s#ghcr.io/ueemon/ai-requirements-navigator#${IMAGE}#" deploy/docker/compose.yml > kit/compose.yml
          { cat .env.example; echo; echo "# このキットの版（docs/github-deploy.md）"; echo "ARN_VERSION=${KIT_VERSION}"; } > kit/.env.example
          cp deploy/keycloak/realm-arn.json kit/keycloak/
          sed "s#UeEmon/ai-requirements-navigator#${GITHUB_REPOSITORY}#" deploy/docker/README.txt > kit/README.txt
          (cd kit && zip -qr "../arn-docker-${KIT_VERSION}.zip" . -x '.env')
          unzip -l "arn-docker-${KIT_VERSION}.zip"
      - name: Smoke test the published image with the Docker kit (no source, no build)
        shell: bash
        working-directory: kit
        run: |
          set -euo pipefail
          cp .env.example .env
          KEY=$(docker run --rm node:22-alpine node -e "console.log(require('crypto').randomBytes(32).toString('base64'))")
          sed -i "s|^MASTER_KEY=.*|MASTER_KEY=$KEY|; s|^ARN_VERSION=.*|ARN_VERSION=${SHA_TAG}|" .env
          docker compose up -d
          docker compose images app
          for i in $(seq 1 60); do curl -fs localhost:8787/health && break; sleep 2; done
          ORG=$(curl -fs -X POST localhost:8787/api/orgs -H 'content-type: application/json' -d '{"name":"kit"}' | jq -r .id)
          curl -fs localhost:8787/api/meta | jq -e '[.phases[].key] | index("rules")' > /dev/null
          curl -fs localhost:8787/ | grep -q '要件ナビ'
          docker compose down -v
          echo "::notice::公開イメージ ${IMAGE}:${SHA_TAG} を Docker キットで起動できました"
      - name: Can the image be pulled without logging in?
        shell: bash
        run: |
          docker logout ghcr.io
          docker rmi "${IMAGE}:${SHA_TAG}" > /dev/null 2>&1 || true
          if docker pull -q "${IMAGE}:${SHA_TAG}" > /dev/null 2>&1; then
            echo "::notice::ログインなしで取得できます（公開）"
          else
            echo "::warning::イメージが非公開です。GitHub の Packages → ai-requirements-navigator → Package settings で Public にしてください（docs/github-deploy.md）"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: arn-docker-${{ env.KIT_VERSION }}
          path: arn-docker-${{ env.KIT_VERSION }}.zip
      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "arn-docker-${KIT_VERSION}.zip" --title "$GITHUB_REF_NAME" --generate-notes \
            --notes "コンテナイメージ: \`${IMAGE}:${KIT_VERSION}\`（Docker Desktop では添付の arn-docker-${KIT_VERSION}.zip を使います。手順: docs/github-deploy.md）"
