# ローカルDockerでの起動:
#   cp .env.example .env   # MASTER_KEY を設定（npm run gen:key）
#   docker compose up --build
#   → http://localhost:8787
#
# 任意のプロファイル:
#   --profile local-llm  … Ollama（ローカルLLM、MIT）
#   --profile oidc       … Keycloak（OIDC認証、Apache-2.0）

services:
  app:
    build: .
    ports:
      - "8787:8787"
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      STORE: postgres
      DATABASE_URL: postgres://arn:arn@db:5432/arn
      KEY_ENCRYPTION: local
      STORAGE: local
      AUTH_MODE: ${AUTH_MODE:-dev}
    volumes:
      - artifacts:/data/artifacts
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: arn
      POSTGRES_PASSWORD: arn
      POSTGRES_DB: arn
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arn"]
      interval: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    profiles: ["local-llm"]
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

  # ログイン画面を試す場合（設定手順: docs/auth.md）
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    profiles: ["oidc"]
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # ブラウザからは localhost:8080、app コンテナからは keycloak:8080 で同じ発行者として扱う
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro

volumes:
  pgdata:
  artifacts:
  ollama:
