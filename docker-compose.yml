# ローカルDocker（Docker Desktop）での起動。手順の詳細: docs/docker-desktop.md
#   cp .env.example .env   # MASTER_KEY を設定
#   docker compose up -d --build
#   → http://localhost:8787
#
# 既定では、このPCからだけ接続できます（127.0.0.1）。開発用の認証（AUTH_MODE=dev）は
# 誰でも管理者を名乗れるため、ほかのPCに公開するときは AUTH_MODE=local か oidc にしてから
# ARN_BIND=0.0.0.0 にしてください。
#
# 任意のプロファイル:
#   --profile local-llm  … Ollama（ローカルLLM、MIT）
#   --profile oidc       … Keycloak（OIDC認証、Apache-2.0）

services:
  app:
    build: .
    ports:
      - "${ARN_BIND:-127.0.0.1}:${ARN_PORT:-8787}:8787"
    env_file: .env
    # .env の値より優先する（コンテナの中での場所・接続先）
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: "8787"
      STORE: postgres
      DATABASE_URL: postgres://arn:arn@db:5432/arn
      DATABASE_SSL: "false"
      KEY_ENCRYPTION: local
      STORAGE: local
      STORAGE_DIR: /data/artifacts
      AUTH_MODE: ${AUTH_MODE:-dev}
      LOCAL_SESSION_HOURS: ${LOCAL_SESSION_HOURS:-12}
      LOCAL_PASSWORD_MIN_LENGTH: ${LOCAL_PASSWORD_MIN_LENGTH:-10}
      LOCAL_SETUP_TOKEN: ${LOCAL_SETUP_TOKEN:-}
    volumes:
      - artifacts:/data/artifacts
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: arn
      POSTGRES_PASSWORD: arn
      POSTGRES_DB: arn
    # DBはこのPCからだけ（ほかのDBと重なるときは DB_PORT=15432 などに変える）
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arn"]
      interval: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    profiles: ["local-llm"]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama:/root/.ollama

  # ログイン画面を試す場合（設定手順: docs/auth.md）
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    profiles: ["oidc"]
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # ブラウザからは localhost:8080、app コンテナからは keycloak:8080 で同じ発行者として扱う
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro

volumes:
  pgdata:
  artifacts:
  ollama:
